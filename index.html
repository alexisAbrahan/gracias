<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias por todo!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body style="background: #111; color: #ffb7c5; font-family: monospace; text-align: center; padding: 40px 20px; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;">

  <div style="max-width: 400px; width: 100%;">
    <h1 style="font-size: 24px; line-height: 1.3;">¡Muchas gracias! 🐴✨</h1>
    <p style="font-size: 15px; line-height: 1.5; margin: 20px 0;">Agradecerte por toda la paciencia y la ayuda con las clases!</p>

    <br>
    <button onclick="confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });" style="background: #ffb7c5; color: #111; border: none; padding: 14px 28px; font-family: monospace; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%;">
      🎉
    </button>
  </div>

</body>
</html>
